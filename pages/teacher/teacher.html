<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Registration | LUCY Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google Fonts: Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #9292db;
        background-image: 
            radial-gradient(at 0% 0%, #a5a6f6 0px, transparent 50%),
            radial-gradient(at 100% 100%, #311868 0px, transparent 50%),
            radial-gradient(at 50% 50%, #4c2882 0px, transparent 100%);
        background-size: 140% 140%;
        animation: gradientGlow 12s ease infinite alternate;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #ffffff;
        overflow-x: hidden;
    }

    @keyframes gradientGlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Window Frame Container */
    .app-window {
        width: 100%;
        max-width: 1050px;
        background: #3c1e78;
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        animation: windowEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes windowEntrance {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Mock Mac Header Bar */
    .window-header {
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 20px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }
    .dot-1 { background: #9c8ce8; }
    .dot-2 { background: #72efdd; }
    .dot-3 { background: #92b0ff; }

    /* Main Split Body Layout */
    .main-container {
        display: flex;
        flex-direction: row;
        min-height: 620px;
        position: relative;
    }

    /* Left Hero Banner */
    .hero-section {
        flex: 1;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    /* Abstract Floating Ribbons */
    .ribbon-container {
        position: absolute;
        top: -40px;
        left: -40px;
        width: 320px;
        height: 320px;
        pointer-events: none;
    }

    .ribbon {
        position: absolute;
        border-radius: 50%;
        border: 28px solid transparent;
    }

    .ribbon-1 {
        width: 240px;
        height: 240px;
        border-top-color: #5ce1e6;
        border-right-color: #5ce1e6;
        transform: rotate(-25deg);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        animation: floatShape1 6s ease-in-out infinite alternate;
    }

    .ribbon-2 {
        width: 200px;
        height: 200px;
        top: 30px;
        left: 20px;
        border-bottom-color: #8c52ff;
        border-left-color: #8c52ff;
        transform: rotate(15deg);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        animation: floatShape2 8s ease-in-out infinite alternate;
    }

    @keyframes floatShape1 {
        0% { transform: rotate(-25deg) translateY(0px); }
        100% { transform: rotate(-15deg) translateY(12px); }
    }

    @keyframes floatShape2 {
        0% { transform: rotate(15deg) translateY(0px); }
        100% { transform: rotate(25deg) translateY(-10px); }
    }

    .brand-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2;
        margin-top: 100px;
    }

    .logo-icon {
        font-size: 32px;
        color: #ffffff;
        transition: transform 0.3s ease;
    }

    .brand-logo:hover .logo-icon {
        transform: scale(1.1) rotate(-5deg);
    }

    .brand-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .brand-subtitle {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .hero-text {
        z-index: 2;
        margin-top: 30px;
        max-width: 360px;
    }

    .hero-text h1 {
        font-size: 22px;
        font-weight: 500;
        line-height: 1.4;
        color: #ffffff;
    }

    .hero-text span {
        font-weight: 700;
    }

    .hero-buttons {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-top: 30px;
        z-index: 2;
    }

    .btn-outline {
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-outline:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
    }

    .link-subtle {
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        text-decoration: none;
        font-weight: 500;
    }

    .link-subtle:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    /* Right Form Card */
    .form-section {
        flex: 1;
        padding: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 32px;
        backdrop-filter: blur(20px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 24px;
        color: #ffffff;
    }

    .form-group {
        margin-bottom: 16px;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 6px;
    }

    /* Profile Photo Upload Field Styles */
    .photo-upload-container {
        display: flex;
        align-items: center;
        gap: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px dashed rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 12px 14px;
        transition: all 0.2s ease;
    }

    .photo-upload-container:hover {
        border-color: #a2e8dd;
        background: rgba(255, 255, 255, 0.1);
    }

    .photo-preview-box {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
    }

    .photo-preview-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .photo-preview-box i {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.5);
    }

    .photo-upload-actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
    }

    .btn-upload-trigger {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        transition: all 0.2s ease;
    }

    .btn-upload-trigger:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    .photo-hint {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.5);
    }

    .btn-remove-photo {
        color: #ff9999;
        font-size: 11px;
        background: none;
        border: none;
        cursor: pointer;
        text-align: left;
        display: none;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 12px 40px 12px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: #ffffff;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: all 0.25s ease;
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }

    input:focus {
        border-color: #a2e8dd;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 0 3px rgba(162, 232, 221, 0.2);
    }

    .field-icon {
        position: absolute;
        right: 14px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        cursor: pointer;
        transition: color 0.2s ease;
    }

    .field-icon:hover {
        color: #ffffff;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: #a2e8dd;
        border: none;
        border-radius: 8px;
        color: #1a0836;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.25s ease;
    }

    .btn-submit:hover {
        background: #8ce2d5;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(140, 226, 213, 0.3);
    }

    .btn-submit:disabled {
        background: rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.4);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .footer-text {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
    }

    .footer-text a {
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
    }

    .footer-text a:hover {
        text-decoration: underline;
    }

    /* Notifications */
    .msg {
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        display: none;
        font-size: 12px;
        font-weight: 500;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .msg.error {
        background: rgba(235, 87, 87, 0.2);
        border: 1px solid #eb5757;
        color: #ff9999;
        display: block;
    }

    .msg.success {
        background: rgba(39, 174, 96, 0.2);
        border: 1px solid #27ae60;
        color: #7bed9f;
        display: block;
    }

    /* Responsive Design */
    @media (max-width: 850px) {
        .main-container {
            flex-direction: column;
        }
        .hero-section {
            padding: 30px;
        }
        .ribbon-container {
            transform: scale(0.7);
            top: -60px;
            left: -60px;
        }
        .brand-logo {
            margin-top: 40px;
        }
    }
</style>
</head>
<body>

<div class="app-window">
    <!-- Window Controls Header -->
    <div class="window-header">
        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
    </div>

    <div class="main-container">
        <!-- Left Hero Section -->
        <div class="hero-section">
            <div class="ribbon-container">
                <div class="ribbon ribbon-1"></div>
                <div class="ribbon ribbon-2"></div>
            </div>

            <div class="brand-logo">
                <i class="fa-solid fa-chalkboard-user logo-icon"></i>
                <div>
                    <div class="brand-title">TEACHER PORTAL</div>
                    <div class="brand-subtitle">Classroom & Educator Network</div>
                </div>
            </div>

            <div class="hero-text">
                <h1>Join the classroom portal to manage <span>student attendance & grading</span></h1>
            </div>

            <div class="hero-buttons">
                <button class="btn-outline" type="button">Teacher Guide</button>
                <a href="#" class="link-subtle">System Requirements</a>
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="form-section">
            <div class="card">
                <h2>Teacher Registration</h2>

                <div id="msg" class="msg"></div>

                <form id="registerForm" onsubmit="event.preventDefault(); registerTeacher();">
                    
                    <!-- Profile Photo Upload Field -->
                    <div class="form-group">
                        <label>Profile Photo (Optional)</label>
                        <div class="photo-upload-container">
                            <div class="photo-preview-box" id="photoPreviewBox">
                                <i class="fa-regular fa-user" id="photoPlaceholderIcon"></i>
                            </div>
                            <div class="photo-upload-actions">
                                <input type="file" id="teacherPhoto" accept="image/png, image/jpeg, image/webp" style="display: none;" onchange="handlePhotoChange(event)">
                                <button type="button" class="btn-upload-trigger" onclick="document.getElementById('teacherPhoto').click()">
                                    <i class="fa-solid fa-camera"></i> Upload Photo
                                </button>
                                <span class="photo-hint" id="photoHint">PNG or JPG (Max 2MB)</span>
                                <button type="button" class="btn-remove-photo" id="removePhotoBtn" onclick="removePhoto()">Remove</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="fullName" placeholder="Sarah Jenkins" required>
                            <i class="fa-regular fa-user field-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="s.jenkins@school.com" required>
                            <i class="fa-regular fa-envelope field-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
                            <i class="fa-regular fa-eye-slash field-icon" id="togglePassword" onclick="togglePass()"></i>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-submit">Create Account</button>
                </form>

                <div class="footer-text">
                    Already have an account? <a href="teacher-login.html">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const TEACHERS_KEY = "teachers";
let currentPhotoBase64 = null;

function getTeachers() {
    try {
        return JSON.parse(localStorage.getItem(TEACHERS_KEY) || "[]");
    } catch (e) {
        return [];
    }
}

async function sha256(txt) {
    const buf = new TextEncoder().encode(txt);
    const hash = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,"0")).join("");
}

function showMessage(text, isError = true) {
    const msgEl = document.getElementById("msg");
    msgEl.textContent = text;
    msgEl.className = "msg " + (isError ? "error" : "success");
}

function togglePass() {
    const p = document.getElementById("password");
    const icon = document.getElementById("togglePassword");
    
    if (p.type === "password") {
        p.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    } else {
        p.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }
}

function handlePhotoChange(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
        showMessage("Photo size must be under 2MB.");
        event.target.value = "";
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        currentPhotoBase64 = e.target.result;
        
        const previewBox = document.getElementById("photoPreviewBox");
        previewBox.innerHTML = `<img src="${currentPhotoBase64}" alt="Profile Preview">`;
        
        document.getElementById("removePhotoBtn").style.display = "inline-block";
        document.getElementById("photoHint").style.display = "none";
    };
    reader.readAsDataURL(file);
}

function removePhoto() {
    currentPhotoBase64 = null;
    document.getElementById("teacherPhoto").value = "";
    document.getElementById("photoPreviewBox").innerHTML = `<i class="fa-regular fa-user" id="photoPlaceholderIcon"></i>`;
    document.getElementById("removePhotoBtn").style.display = "none";
    document.getElementById("photoHint").style.display = "inline";
}

async function registerTeacher() {
    const submitBtn = document.getElementById("submitBtn");
    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const pass = document.getElementById("password").value;

    if (!name || !email || !pass) {
        return showMessage("All fields are required.");
    }

    if (!email.includes("@") || !email.includes(".")) {
        return showMessage("Enter a valid email address.");
    }

    if (pass.length < 6) {
        return showMessage("Password must be at least 6 characters.");
    }

    submitBtn.disabled = true;

    try {
        const list = getTeachers();

        if (list.some(t => t.email === email)) {
            submitBtn.disabled = false;
            return showMessage("This email is already registered.");
        }

        const hashed = await sha256(pass);

        const newTeacher = {
            name,
            email,
            pass: hashed,
            photo: currentPhotoBase64,
            role: "teacher",
            createdAt: Date.now()
        };

        list.push(newTeacher);

        localStorage.setItem(TEACHERS_KEY, JSON.stringify(list));

        // Auto-login active session with photo attached
        localStorage.setItem("active_teacher", JSON.stringify(newTeacher));
        localStorage.setItem("teacher_active_user", JSON.stringify(newTeacher));

        showMessage("Registration successful! Redirecting...", false);

        setTimeout(() => {
            window.location.href = "teacher-profile.html";
        }, 1200);

    } catch (err) {
        console.error(err);
        showMessage("An error occurred during registration.", true);
        submitBtn.disabled = false;
    }
}
</script>

</body>
</html>
