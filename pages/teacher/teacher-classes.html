<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Classroom Module — Flawless Graphics</title>
  <link href="../../assets/css/teacher-dashboard.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Short Skeletal Loading Stylesheet -->
  <link rel="stylesheet" href="../../assets/css/skeleton.css">
  <style>
    .header-left {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 20px;
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .nav-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .nav-btn {
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      background: rgba(255, 255, 255, 0.08) !important;
      color: #ffffff !important;
      padding: 10px 14px !important;
      border-radius: 12px !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.18) !important;
      border-color: rgba(2, 132, 199, 0.5) !important;
      color: #38bdf8 !important;
      transform: translateX(4px) !important;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
    .tab.view-tab {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tab.view-tab:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }
  </style>
</head>
<body>

<!-- Short Skeletal Loading Placeholder -->
<div id="skeletonLoader" class="skeleton-dashboard-overlay">
  <aside class="skeleton-sidebar">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
      <div class="skeleton-shimmer-dark" style="width: 40px; height: 40px; border-radius: 10px;"></div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="skeleton-shimmer-dark" style="width: 120px; height: 16px; border-radius: 4px;"></div>
        <div class="skeleton-shimmer-dark" style="width: 90px; height: 11px; border-radius: 4px;"></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px;">
      <div class="skeleton-shimmer-dark" style="height: 38px; border-radius: 10px;"></div>
      <div class="skeleton-shimmer-dark" style="height: 38px; border-radius: 10px;"></div>
      <div class="skeleton-shimmer-dark" style="height: 38px; border-radius: 10px;"></div>
    </div>
  </aside>
  <main class="skeleton-main">
    <div class="skeleton-topbar">
      <div>
        <div class="skeleton-shimmer-light" style="width: 180px; height: 24px; border-radius: 6px; margin-bottom: 6px;"></div>
        <div class="skeleton-shimmer-light" style="width: 240px; height: 12px; border-radius: 4px;"></div>
      </div>
    </div>
    <div class="skeleton-card-light" style="min-height: 420px;">
      <div style="display: flex; gap: 12px; margin-bottom: 12px;">
        <div class="skeleton-shimmer-light" style="width: 110px; height: 36px; border-radius: 8px;"></div>
        <div class="skeleton-shimmer-light" style="width: 110px; height: 36px; border-radius: 8px;"></div>
      </div>
      <div class="skeleton-shimmer-light" style="width: 100%; height: 50px; border-radius: 8px;"></div>
      <div class="skeleton-shimmer-light" style="width: 100%; height: 50px; border-radius: 8px;"></div>
      <div class="skeleton-shimmer-light" style="width: 100%; height: 50px; border-radius: 8px;"></div>
      <div class="skeleton-shimmer-light" style="width: 100%; height: 50px; border-radius: 8px;"></div>
    </div>
  </main>
</div>

  <header class="header">
    <div class="header-left">
      <div class="brand">
        <div class="logo">FG</div>
        <div><h1>Classroom Module</h1><div class="small">Manage classes & timetable</div></div>
      </div>
      <nav class="nav-left">
        <button class="nav-btn" onclick="window.location.href='teacher-dashboard.html'"><i class="fa-solid fa-gauge"></i> Dashboard</button>
        <button class="nav-btn" onclick="window.location.href='../../welcome.html'"><i class="fa-solid fa-house"></i> Hub</button>
      </nav>
    </div>
  </header>

  <div class="container" id="classesRoot">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div>
          <strong>Views</strong>
          <div class="tabs" style="margin-top:8px">
            <div class="tab view-tab active" data-view="tableView">Table</div>
            <div class="tab view-tab" data-view="cardView">Cards</div>
            <div class="tab view-tab" data-view="timetableView">Timetable</div>
          </div>
        </div>
        <div>
          <input id="searchClass" class="search" placeholder="Search class...">
        </div>
      </div>

      <div id="tableView" class="view-pane">
        <div style="margin-top:12px">
          <table class="table"><thead><tr><th>#</th><th>Class</th><th>Subject</th><th>Teacher</th><th>Students</th><th>Action</th></tr></thead><tbody id="classesTableBody"></tbody></table>
        </div>
      </div>

      <div id="cardView" class="view-pane" style="display:none;margin-top:12px">
        <div id="classesCards" style="display:flex;flex-wrap:wrap;gap:10px"></div>
      </div>

      <div id="timetableView" class="view-pane" style="display:none;margin-top:12px">
        <div style="display:flex;gap:12px;margin-bottom:12px">
          <input id="newClassName" class="input" placeholder="Class name">
          <input id="newClassSubject" class="input" placeholder="Subject">
          <input id="newClassTeacher" class="input" placeholder="Teacher name">
          <button id="addClassBtn" class="btn primary">Add Class</button>
        </div>

        <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">
          <select id="schedDay" class="input"><option value="">Day</option><option value="1">Mon</option><option value="2">Tue</option><option value="3">Wed</option><option value="4">Thu</option><option value="5">Fri</option></select>
          <select id="schedTime" class="input"><option value="">Time</option><option>08:00</option><option>10:00</option><option>12:00</option><option>14:00</option></select>
          <input id="schedClassName" class="input" placeholder="Class name">
          <input id="schedTeacher" class="input" placeholder="Teacher">
          <button id="addScheduleBtn" class="btn primary">Add Slot</button>
        </div>

        <div id="timetableEditorGrid" class="timetable"></div>

        <div style="display:flex;gap:8px;margin-top:12px">
          <button id="exportClassesBtn" class="btn">Export</button>
          <button id="importClassesBtn" class="btn">Import</button>
        </div>
      </div>

    </div>
  </div>

  <script src="../../assets/js/teacher-classes.js"></script>
  <!-- Short Skeletal Loading Script -->
  <script src="../../assets/js/skeleton-loader.js"></script>
</body>
</html>
