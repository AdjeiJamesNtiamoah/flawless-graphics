<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Login | LUCY Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google Fonts: Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #9292db;
        background-image: 
            radial-gradient(at 0% 0%, #a5a6f6 0px, transparent 50%),
            radial-gradient(at 100% 100%, #311868 0px, transparent 50%),
            radial-gradient(at 50% 50%, #4c2882 0px, transparent 100%);
        background-size: 140% 140%;
        animation: gradientGlow 12s ease infinite alternate;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #ffffff;
        overflow-x: hidden;
    }

    @keyframes gradientGlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Window Frame Container */
    .app-window {
        width: 100%;
        max-width: 1050px;
        background: #3c1e78;
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        animation: windowEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes windowEntrance {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Mock Mac Header Bar */
    .window-header {
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 20px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }
    .dot-1 { background: #9c8ce8; }
    .dot-2 { background: #72efdd; }
    .dot-3 { background: #92b0ff; }

    /* Main Split Body Layout */
    .main-container {
        display: flex;
        flex-direction: row;
        min-height: 580px;
        position: relative;
    }

    /* Left Hero Banner */
    .hero-section {
        flex: 1;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    /* Abstract Floating Ribbons */
    .ribbon-container {
        position: absolute;
        top: -40px;
        left: -40px;
        width: 320px;
        height: 320px;
        pointer-events: none;
    }

    .ribbon {
        position: absolute;
        border-radius: 50%;
        border: 28px solid transparent;
    }

    .ribbon-1 {
        width: 240px;
        height: 240px;
        border-top-color: #5ce1e6;
        border-right-color: #5ce1e6;
        transform: rotate(-25deg);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        animation: floatShape1 6s ease-in-out infinite alternate;
    }

    .ribbon-2 {
        width: 200px;
        height: 200px;
        top: 30px;
        left: 20px;
        border-bottom-color: #8c52ff;
        border-left-color: #8c52ff;
        transform: rotate(15deg);
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        animation: floatShape2 8s ease-in-out infinite alternate;
    }

    @keyframes floatShape1 {
        0% { transform: rotate(-25deg) translateY(0px); }
        100% { transform: rotate(-15deg) translateY(12px); }
    }

    @keyframes floatShape2 {
        0% { transform: rotate(15deg) translateY(0px); }
        100% { transform: rotate(25deg) translateY(-10px); }
    }

    .brand-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2;
        margin-top: 100px;
    }

    .logo-icon {
        font-size: 32px;
        color: #ffffff;
        transition: transform 0.3s ease;
    }

    .brand-logo:hover .logo-icon {
        transform: scale(1.1) rotate(-5deg);
    }

    .brand-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .brand-subtitle {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .hero-text {
        z-index: 2;
        margin-top: 30px;
        max-width: 360px;
    }

    .hero-text h1 {
        font-size: 22px;
        font-weight: 500;
        line-height: 1.4;
        color: #ffffff;
    }

    .hero-text span {
        font-weight: 700;
    }

    .hero-buttons {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-top: 30px;
        z-index: 2;
    }

    .btn-outline {
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-outline:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
    }

    .link-subtle {
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        text-decoration: none;
        font-weight: 500;
    }

    .link-subtle:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    /* Right Form Card */
    .form-section {
        flex: 1;
        padding: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        width: 100%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 32px;
        backdrop-filter: blur(20px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 24px;
        color: #ffffff;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 6px;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
        width: 100%;
        padding: 12px 40px 12px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: #ffffff;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: all 0.25s ease;
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }

    input:focus {
        border-color: #a2e8dd;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 0 3px rgba(162, 232, 221, 0.2);
    }

    .field-icon {
        position: absolute;
        right: 14px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 14px;
        cursor: pointer;
        transition: color 0.2s ease;
    }

    .field-icon:hover {
        color: #ffffff;
    }

    /* Custom Checkbox Styling */
    .checkbox-container {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 20px;
        user-select: none;
    }

    .checkbox-container input[type="checkbox"] {
        accent-color: #72efdd;
        width: 15px;
        height: 15px;
        cursor: pointer;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: #a2e8dd;
        border: none;
        border-radius: 8px;
        color: #1a0836;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    .btn-submit:hover {
        background: #8ce2d5;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(140, 226, 213, 0.3);
    }

    .btn-submit:disabled {
        background: rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.4);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .footer-text {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
    }

    .footer-text a {
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
    }

    .footer-text a:hover {
        text-decoration: underline;
    }

    /* Notifications */
    .msg {
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        display: none;
        font-size: 12px;
        font-weight: 500;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .msg.error {
        background: rgba(235, 87, 87, 0.2);
        border: 1px solid #eb5757;
        color: #ff9999;
        display: block;
    }

    .msg.success {
        background: rgba(39, 174, 96, 0.2);
        border: 1px solid #27ae60;
        color: #7bed9f;
        display: block;
    }

    /* Responsive Design */
    @media (max-width: 850px) {
        .main-container {
            flex-direction: column;
        }
        .hero-section {
            padding: 30px;
        }
        .ribbon-container {
            transform: scale(0.7);
            top: -60px;
            left: -60px;
        }
        .brand-logo {
            margin-top: 40px;
        }
    }
</style>
</head>
<body>

<div class="app-window">
    <!-- Window Controls Header -->
    <div class="window-header">
        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
    </div>

    <div class="main-container">
        <!-- Left Hero Section -->
        <div class="hero-section">
            <div class="ribbon-container">
                <div class="ribbon ribbon-1"></div>
                <div class="ribbon ribbon-2"></div>
            </div>

            <div class="brand-logo">
                <i class="fa-solid fa-chalkboard-user logo-icon"></i>
                <div>
                    <div class="brand-title">TEACHER PORTAL</div>
                    <div class="brand-subtitle">Classroom & Educator Network</div>
                </div>
            </div>

            <div class="hero-text">
                <h1>Log in to access your <span>dashboard & active classrooms</span></h1>
            </div>

            <div class="hero-buttons">
                <button class="btn-outline" type="button">Teacher Guide</button>
                <a href="#" class="link-subtle">System Requirements</a>
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="form-section">
            <div class="card">
                <h2>Teacher Login</h2>

                <div id="msg" class="msg"></div>

                <form id="loginForm" onsubmit="event.preventDefault(); teacherLogin();">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="s.jenkins@school.com" required>
                            <i class="fa-regular fa-envelope field-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <i class="fa-regular fa-eye-slash field-icon" id="togglePassword" onclick="togglePass()"></i>
                        </div>
                    </div>

                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember my email</span>
                    </label>

                    <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
                    <button type="button" class="btn-submit" style="margin-top: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;" onclick="quickDemoTeacher()">
                        <i class="fa-solid fa-bolt" style="color: #72efdd; margin-right: 6px;"></i> One-Click Demo Teacher Access
                    </button>
                </form>

                <div class="footer-text">
                    No account? <a href="teacher.html">Register Here</a> • <a href="../../welcome.html">Central Hub</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../../assets/js/auth-session.js"></script>
<script>
const TEACHERS_KEY = "teachers";

function getTeachers() {
    try {
        return JSON.parse(localStorage.getItem(TEACHERS_KEY) || "[]");
    } catch (e) {
        return [];
    }
}

function showMessage(text, isError = true) {
    const msgEl = document.getElementById("msg");
    msgEl.textContent = text;
    msgEl.className = "msg " + (isError ? "error" : "success");
}

function togglePass() {
    const p = document.getElementById("password");
    const icon = document.getElementById("togglePassword");
    
    if (p.type === "password") {
        p.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    } else {
        p.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }
}

function quickDemoTeacher() {
    showMessage("Setting up demo teacher session...", false);
    const demoTeacher = {
        name: "Demo Instructor",
        email: "instructor@flawless.org",
        org: (window.AuthSession ? window.AuthSession.getOrg() : '') || "FLAWLESS GRAPHICS",
        role: "teacher"
    };
    localStorage.setItem("active_teacher", JSON.stringify(demoTeacher));
    localStorage.setItem("teacher_active_user", JSON.stringify(demoTeacher));
    setTimeout(() => {
        window.location.href = "teacher-dashboard.html";
    }, 600);
}

async function teacherLogin() {
    const submitBtn = document.getElementById("submitBtn");
    const email = document.getElementById("email").value.trim().toLowerCase();
    const pw = document.getElementById("password").value;

    if (!email || !pw) {
        return showMessage("Please enter your login details.");
    }

    submitBtn.disabled = true;

    try {
        const list = getTeachers();
        const hashed = window.AuthSession ? await window.AuthSession.sha256(pw) : pw;

        let teacher = list.find(t =>
            t.email === email &&
            t.pass === hashed &&
            t.role === "teacher"
        );

        if (!teacher) {
            // Allow general user or demo fallback
            const activeUser = window.AuthSession ? window.AuthSession.getUser() : null;
            if (activeUser && activeUser.email === email) {
                teacher = activeUser;
            } else {
                submitBtn.disabled = false;
                return showMessage("Incorrect email or password.");
            }
        }

        // Save session keys
        localStorage.setItem("active_teacher", JSON.stringify(teacher));
        localStorage.setItem("teacher_active_user", JSON.stringify(teacher));

        if (document.getElementById("rememberMe").checked) {
            localStorage.setItem("remember_teacher_email", email);
        } else {
            localStorage.removeItem("remember_teacher_email");
        }

        showMessage("Authentication successful! Entering Teacher Portal...", false);

        setTimeout(() => {
            window.location.href = "teacher-dashboard.html";
        }, 800);

    } catch (err) {
        console.error(err);
        showMessage("An error occurred during sign in.", true);
        submitBtn.disabled = false;
    }
}

window.onload = () => {
    const saved = localStorage.getItem("remember_teacher_email");
    if (saved) {
        document.getElementById("email").value = saved;
        document.getElementById("rememberMe").checked = true;
    }
};
</script>

</body>
</html>
