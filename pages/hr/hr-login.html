<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FLAWLESS GRAPHICS — HR Portal Sign In</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- AOS Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --bg-outer: #F4F7FB;
      --card-bg: rgba(255, 255, 255, 0.8);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #0F172A;
      --text-muted: #64748B;
      --accent: #2563EB;
      --accent-gradient: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);
      --input-bg: rgba(255, 255, 255, 0.7);
      --input-border: rgba(203, 213, 225, 0.8);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
      --radius-xl: 24px;
      --radius-md: 12px;
    }

    .dark {
      --bg-outer: #030712;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent: #38BDF8;
      --accent-gradient: linear-gradient(135deg, #0284C7 0%, #6366F1 100%);
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.12);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease; }

    body {
      background-color: var(--bg-outer);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Ambient Glows */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: var(--accent-gradient);
      filter: blur(140px);
      opacity: 0.15;
      z-index: -1;
      pointer-events: none;
    }
    body::before { top: -100px; left: -100px; }
    body::after { bottom: -100px; right: -100px; }

    /* HEADER */
    header {
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .logo-circle {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }
    .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* BUTTON STYLES */
    .btn-back {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .dark .btn-back { background: rgba(255, 255, 255, 0.05); }
    .btn-back:hover {
      background: rgba(37, 99, 235, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateX(-2px);
    }

    .theme-toggle-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dark .theme-toggle-btn { background: rgba(255, 255, 255, 0.05); }

    /* CONTAINER */
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      flex: 1;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: 40px;
      position: relative;
    }

    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .login-header p { font-size: 13px; color: var(--text-muted); }

    /* FORM STYLES */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i.icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
    }
    .remember-me { display: flex; align-items: center; gap: 6px; color: var(--text-muted); cursor: pointer; }
    .forgot-link { color: var(--accent); text-decoration: none; font-weight: 600; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 24px -5px rgba(37, 99, 235, 0.5); }

    .card-footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .card-footer-link a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }
    .card-footer-link a:hover {
      color: var(--accent);
    }

    /* ERROR FEEDBACK */
    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #EF4444;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="../../welcome.html" class="brand">
      <div class="logo-circle">FG</div>
      <div class="brand-title">FLAWLESS GRAPHICS</div>
    </a>

    <div class="header-actions">
      <!-- BACK TO WELCOME BUTTON -->
      <a href="../../welcome.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Hub</span>
      </a>

      <!-- THEME TOGGLE BUTTON -->
      <button class="theme-toggle-btn" id="themeBtn">
        <i class="fa-solid fa-moon"></i> <span id="themeText">Dark</span>
      </button>
    </div>
  </header>

  <!-- LOGIN CARD -->
  <main>
    <div class="login-card" data-aos="zoom-in" data-aos-duration="600">
      <div class="login-header">
        <h2>HR Portal Login</h2>
        <p>Access your organization's administrative tools</p>
      </div>

      <div class="alert-error" id="errorBox">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorMessage">Please complete all fields.</span>
      </div>

      <form id="hrLoginForm">
        <div class="form-group">
          <label class="form-label" for="orgName">Organization Code / Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-building icon"></i>
            <input type="text" id="orgName" class="form-input" placeholder="e.g. FLAWLESS GRAPHICS" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="hrEmail">HR Admin Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope icon"></i>
            <input type="email" id="hrEmail" class="form-input" placeholder="admin@flawlessgraphics.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="hrPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" id="hrPassword" class="form-input" placeholder="••••••••" required />
            <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Remember active session
          </label>
          <a href="#" class="forgot-link" onclick="alert('Please contact System IT Support to reset credentials.')">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit">
          <span>Sign In to HR Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button type="button" class="btn-submit" style="margin-top: 10px; background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.3); color: var(--text-main);" onclick="quickDemoHRLogin()">
          <i class="fa-solid fa-bolt" style="color: var(--accent);"></i>
          <span>One-Click Demo HR Access</span>
        </button>
      </form>

      <!-- CARD FOOTER RETURN LINK -->
      <div class="card-footer-link">
        <a href="../../welcome.html"><i class="fa-solid fa-house"></i> Return to Central Hub</a>
      </div>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Flawless Graphics — Enterprise HR Management System
  </footer>

  <!-- SCRIPT LOGIC -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="../../assets/js/auth-session.js"></script>
  <script>
    AOS.init({ once: true });

    // ---------- THEME SWITCHER ----------
    const el = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');

    function applyTheme(isDark) {
      if (isDark) {
        el.classList.add('dark');
        themeBtn.innerHTML = `<i class="fa-solid fa-sun"></i> <span>Light</span>`;
      } else {
        el.classList.remove('dark');
        themeBtn.innerHTML = `<i class="fa-solid fa-moon"></i> <span>Dark</span>`;
      }
      localStorage.setItem('fg_theme_dark', isDark);
    }

    const savedTheme = localStorage.getItem('fg_theme_dark');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme === null ? prefersDark : savedTheme === 'true');

    themeBtn.addEventListener('click', () => applyTheme(!el.classList.contains('dark')));

    // ---------- SHOW/HIDE PASSWORD ----------
    const togglePassword = document.getElementById('togglePassword');
    const hrPassword = document.getElementById('hrPassword');

    togglePassword.addEventListener('click', () => {
      const type = hrPassword.type === 'password' ? 'text' : 'password';
      hrPassword.type = type;
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });

    // Quick Demo HR Access
    function quickDemoHRLogin() {
      if (window.AuthSession) {
        window.AuthSession.initDemoSession();
      }
      window.location.href = 'hr-dashboard.html';
    }

    // ---------- LOGIN AUTH LOGIC ----------
    const loginForm = document.getElementById('hrLoginForm');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');

    // Pre-fill active org if available
    const existingOrg = (window.AuthSession ? window.AuthSession.getOrg() : null) || localStorage.getItem('active_org') || 'FLAWLESS GRAPHICS';
    if (existingOrg) document.getElementById('orgName').value = existingOrg;

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const orgName = document.getElementById('orgName').value.trim();
      const hrEmail = document.getElementById('hrEmail').value.trim();
      const password = document.getElementById('hrPassword').value.trim();

      if (!orgName || !hrEmail || !password) {
        showError('Please fill in all required fields.');
        return;
      }

      if (password.length < 4) {
        showError('Password must be at least 4 characters long.');
        return;
      }

      // Persist active session credentials across all portals
      if (window.AuthSession) {
        window.AuthSession.setUser({
          org: orgName,
          name: hrEmail.split('@')[0],
          email: hrEmail,
          role: 'hr'
        });
      } else {
        localStorage.setItem('active_org', orgName);
        localStorage.setItem('activeHR', JSON.stringify({
          name: hrEmail.split('@')[0],
          email: hrEmail,
          role: 'HR Admin'
        }));
      }

      // Redirect to the HR Dashboard
      window.location.href = 'hr-dashboard.html';
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBox.style.display = 'flex';
    }

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
