<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Organization</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    * {
        box-sizing: border-box;
    }
    body {
        background: #071833;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        color: white;
    }
    .box {
        width: 100%;
        max-width: 380px;
        background: #102a57;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    h2 { 
        text-align: center; 
        margin-top: 0;
        margin-bottom: 20px; 
    }
    label {
        display: block;
        margin-top: 10px;
        font-size: 14px;
    }
    input {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid transparent;
        margin-top: 6px;
        margin-bottom: 12px;
        font-size: 14px;
    }
    input:focus {
        outline: 2px solid #00a8ff;
    }
    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #00a8ff;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        font-weight: bold;
    }
    button:hover { background: #0089d6; }
    button:disabled { background: #555; cursor: not-allowed; }
    a { color: #4ac3ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .center { text-align: center; margin-top: 15px; font-size: 14px; }
    
    .msg {
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        display: none;
        font-size: 14px;
        text-align: center;
    }
    .msg.error { background: #e74c3c; color: white; display: block; }
    .msg.success { background: #2ecc71; color: white; display: block; }
</style>
</head>
<body>

<div class="box">
    <h2>Create Account</h2>

    <div id="msg" class="msg"></div>

    <form id="registerForm" onsubmit="register(event)">
        <label for="orgName">Organization Name</label>
        <input type="text" id="orgName" placeholder="Flawless Graphics Ltd" required>

        <label for="fullName">Admin Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" required>

        <label for="email">Email (Login Username)</label>
        <input type="email" id="email" placeholder="admin@company.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 8 characters" required minlength="8">

        <button type="submit" id="submitBtn">Register</button>
    </form>

    <div class="center">
        Already registered? <a href="site-login.html">Login</a>
    </div>
</div>

<script>
const USERS_KEY = "organizations_users";

function readUsers() {
    try {
        return JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
    } catch (e) {
        return [];
    }
}

async function sha256(text) {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(hash)].map(x => x.toString(16).padStart(2, "0")).join("");
}

function showMessage(text, isError = true) {
    const msgEl = document.getElementById("msg");
    msgEl.textContent = text;
    msgEl.className = "msg " + (isError ? "error" : "success");
}

async function register(event) {
    event.preventDefault(); // Prevents page refresh on form submit

    const submitBtn = document.getElementById("submitBtn");
    const org = document.getElementById("orgName").value.trim();
    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const pw = document.getElementById("password").value;
    const role = "admin";

    if (!org || !name || !email || !pw) {
        return showMessage("Please complete all fields.");
    }

    if (pw.length < 8) {
        return showMessage("Password must be at least 8 characters.");
    }

    submitBtn.disabled = true;

    try {
        let users = readUsers();

        if (users.some(u => u.email === email)) {
            submitBtn.disabled = false;
            return showMessage("Email address is already registered.");
        }

        const hashed = await sha256(pw);

        users.push({
            org: org,
            name: name,
            email: email,
            pass: hashed,
            role: role,
            createdAt: Date.now()
        });

        localStorage.setItem(USERS_KEY, JSON.stringify(users));

        showMessage("Registration successful! Redirecting to login...", false);

        setTimeout(() => {
            window.location.href = "site-login.html";
        }, 1500);

    } catch (err) {
        console.error(err);
        showMessage("An error occurred during registration.", true);
        submitBtn.disabled = false;
    }
}
</script>
</body>
</html>
